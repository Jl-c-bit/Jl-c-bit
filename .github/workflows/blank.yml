name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test Streakly
        working-directory: streakly
        run: npm test

      - name: Test PrivatePDF
        working-directory: privatepdf
        run: npm test

      - name: Check PrivatePDF pages are up to date
        working-directory: privatepdf
        run: npm run build && git diff --exit-code -- .

      - name: Test Kindred Goods shop
        working-directory: shop
        run: npm test

      - name: Test Connect demo and site functions
        working-directory: connect-demo
        run: npm ci --no-audit --no-fund && npm test
