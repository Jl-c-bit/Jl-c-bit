name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: afterhours_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test Streakly
        working-directory: streakly
        run: npm test

      - name: Test PrivatePDF
        working-directory: privatepdf
        run: npm test

      - name: Check PrivatePDF pages are up to date
        working-directory: privatepdf
        run: npm run build && git diff --exit-code -- .

      - name: Test Kindred Goods shop
        working-directory: shop
        run: npm test

      - name: Test ListingRadar (Telegram alert bot)
        working-directory: alert-bot
        run: npm test

      - name: Test OrderTap (WhatsApp ordering)
        working-directory: whatsapp-orders
        run: npm test

      - name: Test Connect demo and site functions
        working-directory: connect-demo
        run: npm ci --no-audit --no-fund && npm test

      - name: Test Afterhours (with Postgres)
        working-directory: afterhours
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/afterhours_test
        run: npm ci --no-audit --no-fund && npm test
