name: PrivatePDF stats

# Prints PrivatePDF's anonymous visit counts in the job log, so they can be
# read without opening the site. Run it from the Actions tab or on schedule.
on:
  workflow_dispatch:
  schedule:
    - cron: "40 21 * * *"

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch visit counts
        run: |
          echo "STATS_BEGIN"
          curl -fsS https://chimerical-crostata-fb89ec.netlify.app/pdf/api/stats
          echo
          echo "STATS_END"
