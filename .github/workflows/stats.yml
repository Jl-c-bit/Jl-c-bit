name: PrivatePDF stats

# Posts PrivatePDF's anonymous visit counts as a notice on the run (readable
# through the GitHub API as a check-run annotation). Run it from the Actions
# tab or on schedule.
on:
  workflow_dispatch:
  schedule:
    - cron: "40 21 * * *"

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch visit counts
        run: |
          data=$(curl -fsS https://chimerical-crostata-fb89ec.netlify.app/pdf/api/stats | tr -d '\n')
          echo "$data"
          echo "::notice title=pdf-stats::$data"
