# One Netlify site serves every app:
#   /           Streakly (static)
#   /pdf/       PrivatePDF (static)
#   /connect/   Stripe Connect demo (Express app in a Netlify Function; the
#               function routes itself via `config.path`)
[build]
  command = "(cd connect-demo && npm ci --omit=dev --no-audit --no-fund) && rm -rf dist && mkdir -p dist/pdf && cp -R streakly/. dist/ && cp -R privatepdf/. dist/pdf/ && rm -rf dist/pdf/test dist/pdf/tools dist/pdf/package.json dist/pdf/netlify.toml dist/pdf/README.md"
  publish = "dist"

[functions]
  directory = "connect-demo/netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/pdf/assets/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
