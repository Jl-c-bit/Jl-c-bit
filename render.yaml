# Render Blueprint for Afterhours (render.com → New → Blueprint → pick this repo).
# Creates the web service and a Postgres database and wires them together.
# You'll be asked to type MOD_PASSWORD (12+ characters) during setup.
services:
  - type: web
    name: afterhours
    runtime: node
    rootDir: afterhours
    plan: free
    buildCommand: npm ci --omit=dev --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: afterhours-db
          property: connectionString
      - key: MOD_PASSWORD
        sync: false
      - key: TRUST_PROXY
        value: "1"
      - key: IP_HASH_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: "22"

databases:
  - name: afterhours-db
    plan: free
    databaseName: afterhours
    user: afterhours
